name: frontend_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  camera: ^0.12.1
  connectivity_plus: ^7.3.2
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0

  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  # Read aloud with the phone's own voice: no network and no API key.
  flutter_tts: ^4.2.5

  geolocator: ^14.0.1
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  noise_meter: ^6.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  # 13.x needs Android compileSdk 37; Flutter 3.44 projects compile against 36.
  permission_handler: ^12.0.1
  sqflite: ^2.4.4
  speech_to_text: ^7.5.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/illustrations/
